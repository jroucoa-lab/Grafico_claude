name: Analisis tecnico
on:
schedule:
- cron: "45 21 * * 1-5"   # 21:45 UTC = despues del cierre de EE. UU. en horario de verano e invierno
workflow_dispatch:
jobs:
analisis:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.12"
cache: pip
- run: pip install -r requirements.txt
- name: Restaurar cache de datos
uses: actions/cache@v4
with:
path: cache
key: datos-${{ github.run_id }}
restore-keys: datos-
- run: python generador_graficos.py --salida resultados
- uses: actions/upload-artifact@v4
with:
name: resultados
path: resultados
