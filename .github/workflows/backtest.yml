# Copiar a .github/workflows/backtest.yml  (se lanza a mano desde la pestaña Actions)
name: Backtest
on:
  workflow_dispatch:
    inputs:
      anios:
        description: "Años de historico"
        default: "10"
      max_pos:
        description: "Maximo por posicion en $ (varios valores separados por espacio)"
        default: "2500 5000 10000"
      riesgo:
        description: "Riesgo maximo por operacion en $"
        default: "800"
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache_bt
          key: datos-bt-${{ github.run_id }}
          restore-keys: datos-bt-
      - name: Backtest (uno por cada valor de max_pos; la descarga se hace una sola vez)
        run: |
          for mp in ${{ github.event.inputs.max_pos }}; do
            python backtest.py --sp500 --años ${{ github.event.inputs.anios }} \
              --riesgo ${{ github.event.inputs.riesgo }} --max-pos "$mp" \
              --salida "resultados_backtest/mp_$mp"
          done
      - name: Comparativa entre valores de max_pos
        run: |
          python - <<'PY'
          import glob, pandas as pd
          filas = []
          for p in sorted(glob.glob("resultados_backtest/mp_*/backtest_cartera.csv")):
              d = pd.read_csv(p)
              d.insert(0, "max_pos", p.split("mp_")[1].split("/")[0])
              filas.append(d)
          cols = ["max_pos", "Variante", "Operaciones tomadas", "Omitidas (sin caja)", "CAGR %",
                  "CAGR aleat. media %", "DD max %", "Racha bajo maximos (años)",
                  "Capital invertido medio %", "S&P 500 CAGR %"]
          pd.concat(filas)[cols].to_csv("resultados_backtest/comparativa_max_pos.csv", index=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: resultados_backtest
